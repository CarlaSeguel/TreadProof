[workspace]
members = ["contracts/tire_registry", "contracts/impact_registry", "contracts/badge"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
